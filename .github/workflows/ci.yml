name: 基础检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      DEEPSEEK_API_KEY: "evaluation-test-key"
      WEB_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --group dev --python 3.12
      - name: 测试前扫描跟踪文件
        run: uv run --frozen python scripts/check_secrets.py
      - name: 离线测试（含本机 HTTP）
        run: uv run --frozen pytest --basetemp=.pytest-ci-tmp --junitxml=.security-artifacts/pytest.xml
      - name: 测试后扫描产物（失败报告也检查）
        if: always()
        run: uv run --frozen python scripts/check_secrets.py --paths .security-artifacts
      - name: 整理模块 lint
        run: >-
          uvx --from ruff==0.17.2 ruff check
          src/research_agent/evaluation src/research_agent/observability
          src/research_agent/evaluate.py src/research_agent/acceptance.py src/research_agent/smoke.py
          src/research_agent/config.py
          src/research_agent/security.py src/research_agent/agent.py src/research_agent/answer.py
          src/research_agent/cli.py src/research_agent/web_server.py src/research_agent/web_search.py
          src/research_agent/workflow.py src/research_agent/rag_updates.py
          scripts eval/run_eval.py eval/run_baseline.py eval/run_tool_baseline.py
          eval/inspect_week1.py eval/datasets/build_week1.py
          eval/run_split_experiment.py eval/datasets/build_week2.py tests/unit/test_split_retrieval.py
          eval/run_quality_experiment.py tests/unit/test_quality.py
          src/research_agent/grounded_retrieval.py
          src/research_agent/evidence_policy.py eval/verify_business.py tests/integration/test_business_quality.py
          eval/review_week4.py eval/smoke_week4.py tests/unit/test_performance.py
          eval/interview_acceptance.py eval/interview_demo.py eval/replay_research_report.py
          tests/unit/test_report_replay.py src/research_agent/quote_validation.py
          tests/unit/test_runtime_observation.py tests/unit/test_quote_validation.py
          eval/run_target.py eval/review_target.py eval/datasets/build_unified.py
          tests/unit/test_grounded_retrieval.py tests/unit/test_target.py
          tests/unit/test_acceptance.py tests/unit/test_baseline.py
          tests/integration/test_langgraph_migration.py
          tests/conftest.py tests/security/test_secret_protection.py
      - name: 整理模块格式
        run: >-
          uvx --from ruff==0.17.2 ruff format --check
          src/research_agent/evaluation src/research_agent/observability
          src/research_agent/evaluate.py src/research_agent/acceptance.py src/research_agent/smoke.py
          src/research_agent/config.py
          src/research_agent/security.py src/research_agent/agent.py src/research_agent/answer.py
          src/research_agent/cli.py src/research_agent/web_server.py src/research_agent/web_search.py
          src/research_agent/workflow.py src/research_agent/rag_updates.py
          scripts eval/run_eval.py eval/run_baseline.py eval/run_tool_baseline.py
          eval/inspect_week1.py eval/datasets/build_week1.py
          eval/run_split_experiment.py eval/datasets/build_week2.py tests/unit/test_split_retrieval.py
          eval/run_quality_experiment.py tests/unit/test_quality.py
          src/research_agent/grounded_retrieval.py
          src/research_agent/evidence_policy.py eval/verify_business.py tests/integration/test_business_quality.py
          eval/review_week4.py eval/smoke_week4.py tests/unit/test_performance.py
          eval/interview_acceptance.py eval/interview_demo.py eval/replay_research_report.py
          tests/unit/test_report_replay.py src/research_agent/quote_validation.py
          tests/unit/test_runtime_observation.py tests/unit/test_quote_validation.py
          eval/run_target.py eval/review_target.py eval/datasets/build_unified.py
          tests/unit/test_grounded_retrieval.py tests/unit/test_target.py
          tests/unit/test_acceptance.py tests/unit/test_baseline.py
          tests/integration/test_langgraph_migration.py
          tests/conftest.py tests/security/test_secret_protection.py
