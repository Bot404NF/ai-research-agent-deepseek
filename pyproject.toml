[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "本地文档检索增强生成、联网搜索与来源引用"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.6.8",
    "langchain-openai==1.7.0",
    "langchain-huggingface==1.2.0",
    "sentence-transformers==5.2.0",
    "torch==2.13.0",
    "langchain-milvus==0.4.0",
    "langchain-text-splitters==1.1.3",
    "pypdf==6.6.2",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: 需要本地模型权重或外部服务的集成检查，默认不运行"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/research_agent/static/index.html" = "research_agent/static/index.html"

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
