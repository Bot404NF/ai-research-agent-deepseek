<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>知研 · 问答与研究</title>
  <link rel="stylesheet" href="/workflow.css?v=consent-v2">

</head>
<body data-mode="chat">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M5 4v16m14-14-6 6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
    <symbol id="i-research" viewBox="0 0 24 24"><path d="M8 6V3h8v3M3 6h18v15H3zM3 11h18m-9-2v4"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 4v5h5M3 9a9 9 0 1 1 0 7m9-10v6l4 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </defs></svg>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="导航侧栏">
      <div class="brand"><span class="brand-name">知研</span><button class="icon-button" id="collapseSidebar" type="button" aria-label="收起侧栏" aria-expanded="true" aria-controls="sidebar"><svg class="icon"><use href="#i-collapse"/></svg></button></div>
      <button id="newConversation" class="sidebar-new-chat" type="button" title="新建对话"><svg class="icon"><use href="#i-plus"/></svg><span>新建对话</span></button>
      <div class="collapsed-navigation" aria-label="侧栏分区">
        <button class="icon-button" type="button" data-section="librarySection" aria-label="展开资料库"><svg class="icon"><use href="#i-db"/></svg></button>
        <button class="icon-button" type="button" data-section="researchSection" aria-label="展开研究任务"><svg class="icon"><use href="#i-research"/></svg></button>
        <button class="icon-button" type="button" data-section="historySection" aria-label="展开历史会话"><svg class="icon"><use href="#i-history"/></svg></button>
      </div>
      <div class="sidebar-scroll">
        <section class="sidebar-section" id="librarySection" aria-labelledby="libraryLabel">
          <div class="side-label"><span id="libraryLabel">资料库</span><span id="databaseCount"></span></div>
          <div id="databaseList" class="database-list"><div class="history-empty">正在读取资料库…</div></div>
          <button class="import-open" id="openImport" type="button"><svg class="icon"><use href="#i-plus"/></svg>导入资料</button>
        </section>
        <section class="sidebar-section" id="researchSection" aria-labelledby="researchLabel">
          <div class="side-label"><span id="researchLabel">研究任务</span></div>
          <div id="researchTaskList" class="research-task-list"><span class="history-empty">正在读取任务…</span></div>
        </section>
        <section class="sidebar-section" id="historySection" aria-labelledby="historyLabel">
          <div class="history-head"><span id="historyLabel">历史会话</span></div>
          <div id="conversationList" class="history-list"><div class="history-empty">正在读取…</div></div>
        </section>
      </div>
      <div class="sidebar-foot"><span id="knowledgeStatus" class="status" role="status" aria-live="polite" title="正在检查资料库"><i class="dot"></i><span id="knowledgeStatusText" class="status-text">正在检查资料库…</span></span></div>
    </aside>
    <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="关闭侧栏" hidden></button>
    <main class="workspace">
      <header class="workspace-head">
        <div class="header-leading"><button id="openSidebar" class="icon-button" type="button" aria-label="打开侧栏" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button><span class="workspace-title">问答</span><span class="workspace-subtitle" hidden></span></div>
        <nav class="research-mode" aria-label="工作区切换"><button id="chatMode" type="button" aria-pressed="true" aria-controls="chatWorkspace">问答</button><button id="researchMode" type="button" aria-pressed="false" aria-controls="researchWorkspace">研究</button></nav>
        <div class="top-actions"><span id="sessionLabel" class="session"></span><button id="newConversationMobile" class="icon-button mobile-new-chat" type="button" aria-label="新建对话"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      </header>
      <section id="researchWorkspace" class="research-workspace" aria-label="研究工作区" hidden>
        <div class="research-toolbar"><button id="newResearch" type="button">＋ 新建研究</button><select id="researchHistory" aria-label="打开历史研究任务"><option value="">打开历史研究任务</option></select></div>
        <p id="researchNotice" class="research-notice" role="status" aria-live="polite"></p>
        <div id="researchContent"></div>
      </section>
      <section class="chat is-empty" id="chatWorkspace" aria-label="问答工作区">
        <div class="chat-head"><span>研究对话</span><span id="sessionId" class="session"></span></div>
        <div class="chat-content">
          <div id="messages"><div class="empty"><strong>今天想研究什么？</strong></div></div>
        </div>
        <div class="chips" aria-label="快捷询问">
          <button class="chip" data-prompt="请联网查找与资料库主题相关的可靠网上资料，对比网上资料与本地资料库内容，指出一致之处、差异和各自来源。">联网对比资料</button>
          <button class="chip" data-prompt="请比较资料库中不同来源对同一主题的记载，概括主要区别，并分别标注来源。">比较资料记载</button>
          <button class="chip" data-prompt="请检查资料库中与当前主题相关的内容，找出资料之间的矛盾、信息缺漏和需要进一步核实的说法，并列出对应来源；只指出证据支持的问题，不要推测。">查找待核实信息</button>
        </div>
        <form id="chatForm" class="composer">
          <div class="input-wrap"><textarea id="question" rows="1" placeholder="向资料库提问，或输入研究主题…" aria-label="输入问题" required></textarea><button class="send" id="sendButton" type="submit" aria-label="发送" disabled><svg class="icon"><use href="#i-send"/></svg></button></div>
          <div class="hint">Enter 发送 · Shift + Enter 换行</div>
        </form>
      </section>
      <footer>回答可能有误，请结合来源核对。</footer>
    </main>
  </div>
  <div class="modal-backdrop" id="importModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <div class="modal-header"><div><div class="modal-title" id="importTitle">导入资料</div><div class="modal-desc">新建目录并导入，供后续问答与研究检索</div></div><button class="modal-close" id="closeImport" type="button" aria-label="关闭">×</button></div>
      <div class="field-label">新建目录</div>
      <label class="field-label" id="databaseFieldLabel" for="newDatabaseName">新目录名称</label>
      <input id="newDatabaseName" type="text" placeholder="请输入目录名称" maxlength="80" required>
      <div class="drop" id="fileDrop"><label class="choose" for="fileInput">选择文件</label>　<label class="choose" for="folderInput">选择文件夹</label>，也可拖放文件<input id="fileInput" type="file" accept=".txt,.md,.pdf" multiple><input id="folderInput" type="file" accept=".txt,.md,.pdf" webkitdirectory directory multiple><div class="selected-files" id="selectedFiles">支持选择多个 TXT、Markdown、PDF 文件，或选择包含这些文件的文件夹；单次上传总量不超过 100 MB。</div></div>
      <div class="modal-note">文件导入后可供问答和研究检索。支持 TXT、Markdown、PDF；扫描版 PDF 暂不支持 OCR。</div>
      <div class="notice" id="uploadNotice" role="status" aria-live="polite"></div>
      <div class="modal-actions"><button class="cancel" id="cancelImport" type="button">取消</button><button id="createDatabase" class="send" type="button">新建目录并导入</button></div>
    </section>
  </div>
  <div class="modal-backdrop" id="confirmModal" aria-hidden="true">
    <section class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal-header"><div><div class="modal-title" id="confirmTitle">确认删除</div><div class="confirm-desc" id="confirmDescription"></div></div><button class="modal-close" id="closeConfirm" type="button" aria-label="关闭">×</button></div>
      <div class="modal-actions"><button class="cancel" id="cancelConfirm" type="button">取消</button><button class="send" id="confirmDelete" type="button" style="background:#c8514b">删除</button></div>
    </section>
  </div>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#chatForm');
    const input = document.querySelector('#question');
    const sendButton = document.querySelector('#sendButton');
    const chatWorkspace = document.querySelector('#chatWorkspace');
    const sidebar = document.querySelector('#sidebar');
    const sidebarBackdrop = document.querySelector('#sidebarBackdrop');
    const mainWorkspace = document.querySelector('.workspace');
    let sidebarTrigger = null;
    function closeSidebar() {
      const wasOpen = document.body.classList.contains('sidebar-open');
      document.body.classList.remove('sidebar-open');sidebarBackdrop.hidden=true;
      sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');
      mainWorkspace.inert=false;
      document.querySelector('#openSidebar').setAttribute('aria-expanded','false');
      if(wasOpen && sidebarTrigger?.isConnected)sidebarTrigger.focus();
    }
    document.querySelector('#openSidebar').addEventListener('click',event=>{
      sidebarTrigger=event.currentTarget;document.body.classList.add('sidebar-open');sidebarBackdrop.hidden=false;
      sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');mainWorkspace.inert=true;
      event.currentTarget.setAttribute('aria-expanded','true');document.querySelector('#collapseSidebar').focus();
    });
    document.querySelector('#collapseSidebar').addEventListener('click',()=>{
      if(window.matchMedia('(max-width:767px)').matches){closeSidebar();return;}
      const collapsed=document.body.classList.toggle('sidebar-collapsed');
      document.querySelector('#collapseSidebar').setAttribute('aria-expanded',String(!collapsed));
      document.querySelector('#collapseSidebar').setAttribute('aria-label',collapsed?'展开侧栏':'收起侧栏');
    });
    sidebarBackdrop.addEventListener('click',closeSidebar);
    window.matchMedia('(max-width:767px)').addEventListener('change',closeSidebar);
    document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{
      document.body.classList.remove('sidebar-collapsed');
      document.querySelector('#collapseSidebar').setAttribute('aria-expanded','true');
      document.querySelector('#collapseSidebar').setAttribute('aria-label','收起侧栏');
      document.getElementById(button.dataset.section).scrollIntoView({block:'nearest'});
      document.querySelector('#collapseSidebar').focus();
    }));
    const overlayTriggers=new WeakMap();
    function openOverlay(overlay,firstFocus){
      const trigger=document.activeElement;closeSidebar();overlayTriggers.set(overlay,trigger);
      overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
      document.querySelector('.shell').inert=true;firstFocus.focus();
    }
    function closeOverlay(overlay){
      overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');
      document.querySelector('.shell').inert=false;
      const trigger=overlayTriggers.get(overlay);
      if(trigger?.isConnected){if(sidebar.contains(trigger)&&window.matchMedia('(max-width:767px)').matches)document.querySelector('#openSidebar').focus();else trigger.focus();}
    }
    document.addEventListener('keydown',event=>{
      const overlay=document.querySelector('.modal-backdrop.open');
      const region=overlay||(document.body.classList.contains('sidebar-open')?sidebar:null);
      if(event.key==='Escape'&&!overlay){closeSidebar();return;}
      if(event.key!=='Tab'||!region)return;
      const items=[...region.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(item=>item.getClientRects().length);
      if(!items.length){event.preventDefault();return;}
      if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1).focus();}
      else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0].focus();}
    });
    let followOutput=true;
    function scrollMessages(force=false){if(force||followOutput)messages.scrollTop=messages.scrollHeight;}
    messages.addEventListener('scroll',()=>{followOutput=messages.scrollHeight-messages.scrollTop-messages.clientHeight<=80;});
    let composing=false;
    function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,192)+'px';if(!chatBusy)sendButton.disabled=!input.value.trim();}
    let chatBusy=false;
    function setChatBusy(busy){
      chatBusy=busy;
      document.querySelectorAll('#newConversation,#newConversationMobile,.history-item,.history-more,.suggestion,.chip').forEach(button=>{button.disabled=busy;});
    }
    input.addEventListener('input',resizeInput);
    input.addEventListener('compositionstart',()=>{composing=true;});
    input.addEventListener('compositionend',()=>{composing=false;resizeInput();});
    const sessionId = localStorage.getItem('research-agent-session') || crypto.randomUUID().replaceAll('-', '').slice(0, 12);
    localStorage.setItem('research-agent-session', sessionId);
    document.querySelector('#sessionId').textContent = `会话 ${sessionId}`;
    document.querySelector('#sessionLabel').textContent = sessionId;
    let empty = true;
    let currentSessionId = sessionId;
    let conversationRequest = 0, conversationListRequest = 0;

    function resetMessages() {
      messages.innerHTML = '<div class="empty"><strong>今天想研究什么？</strong></div>';chatWorkspace.classList.add('is-empty');followOutput=true;
      empty = true;
    }
    function newConversation() {
      if(chatBusy)return;
      conversationRequest++;
      input.value='';resizeInput();
      currentSessionId = crypto.randomUUID().replaceAll('-', '').slice(0, 12);
      localStorage.setItem('research-agent-session', currentSessionId);
      document.querySelector('#sessionId').textContent = `会话 ${currentSessionId}`;
      document.querySelector('#sessionLabel').textContent = currentSessionId;
      resetMessages();
      refreshConversations();
      input.focus();
    }
    async function refreshConversations(offset = 0) {
      const list = document.querySelector('#conversationList');
      const request = ++conversationListRequest;
      try {
        const response = await fetch(`/api/conversations?limit=50&offset=${offset}`, {cache:'no-store'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '读取失败');
        if(request!==conversationListRequest)return;
        if(offset===0)list.replaceChildren();
        else list.querySelector('.history-more')?.remove();
        if(data.migration_warnings?.length && offset===0){
          const warning=document.createElement('div');warning.className='history-empty';warning.textContent=`${data.migration_warnings.length} 个旧会话尚未导入，原文件已保留，请检查会话文件。`;list.append(warning);
        }
        if (!data.conversations.length) { const emptyList=document.createElement('div');emptyList.className='history-empty';emptyList.textContent='暂时没有已完成的对话';list.append(emptyList);return; }
        for (const conversation of data.conversations) {
          const row=document.createElement('div');row.className='history-row';
          const button = document.createElement('button');
          button.type='button'; button.className=`history-item ${conversation.id===currentSessionId?'active':''}`;
          button.textContent=conversation.title; button.title=conversation.title;button.disabled=chatBusy;button.setAttribute('aria-current',String(conversation.id===currentSessionId));
          button.onclick=()=>openConversation(conversation.id);
          const remove=document.createElement('button');remove.type='button';remove.className='row-delete';remove.innerHTML='<svg class="icon"><use href="#i-trash"/></svg>';remove.title='删除此会话';
          remove.onclick=()=>confirmDeletion('删除历史会话',`确定删除“${conversation.title}”吗？将删除数据库中的对话；如有迁移前的 JSON 备份，文件仍保留。`,async()=>{
            const response=await fetch(`/api/conversations/${encodeURIComponent(conversation.id)}`,{method:'DELETE'});await readDeleteResponse(response,'删除会话失败。');
            if(currentSessionId===conversation.id){localStorage.removeItem('research-agent-session');newConversation();}else await refreshConversations();
          });
          row.append(button,remove);list.append(row);
        }
        if(data.has_more){
          const more=document.createElement('button');more.type='button';more.className='history-item history-more';more.textContent='加载更多会话';more.disabled=chatBusy;
          more.onclick=()=>{if(chatBusy)return;more.disabled=true;refreshConversations(data.next_offset);};list.append(more);
        }
      } catch {
        if(request!==conversationListRequest)return;
        if(offset===0)list.innerHTML='<div class="history-empty">暂时无法读取历史对话</div>';
        else {const more=list.querySelector('.history-more');if(more){more.disabled=chatBusy;more.textContent='加载失败，点击重试';}}
      }
    }
    function prependHistoryPager(id, data, generation) {
      if(!data.has_more)return;
      let loading=false;
      const more=document.createElement('button');more.type='button';more.className='history-item history-more';more.textContent='加载更早对话';
      more.onclick=async()=>{
        if(chatBusy||more.disabled||loading)return;loading=true;more.disabled=true;more.textContent='正在读取…';
        try{
          const response=await fetch(`/api/conversations/${encodeURIComponent(id)}?limit=20&before=${data.next_before}`,{cache:'no-store'});
          const page=await response.json();if(!response.ok)throw new Error(page.error||'读取失败');
          if(id!==currentSessionId||generation!==conversationRequest||chatBusy)return;
          const height=messages.scrollHeight,top=messages.scrollTop;
          const fragment=document.createDocumentFragment();
          for(const turn of page.turns){fragment.append(addMessage('user',turn.user).node,addMessage('assistant',turn.assistant).node);}
          more.remove();messages.prepend(fragment);prependHistoryPager(id,page,generation);
          messages.scrollTop=top+messages.scrollHeight-height;
        }catch{more.textContent='读取失败，点击重试';}
        finally{loading=false;more.disabled=chatBusy;if(more.textContent==='正在读取…')more.textContent='加载更早对话';}
      };
      messages.prepend(more);
    }
    async function openConversation(id) {
      if(chatBusy)return;
      const request=++conversationRequest;
      try {
        const response=await fetch(`/api/conversations/${encodeURIComponent(id)}`,{cache:'no-store'});
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||'读取失败');
        if(request!==conversationRequest||chatBusy)return;
        currentSessionId=id; localStorage.setItem('research-agent-session',id);
        document.querySelector('#sessionId').textContent=`会话 ${id}`;
        document.querySelector('#sessionLabel').textContent=id;
        resetMessages();
        for(const turn of data.turns){addMessage('user',turn.user);addMessage('assistant',turn.assistant);}
        prependHistoryPager(id,data,request);
        scrollMessages(true);
        refreshConversations();
      } catch(error) { if(request===conversationRequest)addMessage('error',error.message||'无法读取历史对话。'); }
    }
    const confirmModal=document.querySelector('#confirmModal');const confirmButton=document.querySelector('#confirmDelete');
    let pendingDelete=null;
    async function readDeleteResponse(response,fallback){
      let data;
      try{data=await response.json();}
      catch{
        const contentType=response.headers.get('content-type')||'';
        if(response.status===501||response.status===405||contentType.includes('text/html'))throw new Error('本地网页服务尚未加载删除功能，请重启网页服务后再试。');
        throw new Error(fallback);
      }
      if(!response.ok)throw new Error(data.error||fallback);
      return data;
    }
    function closeConfirmation(force=false){if(confirmButton.disabled&&force!==true)return;closeOverlay(confirmModal);pendingDelete=null;}
    function confirmDeletion(title,description,action){
      document.querySelector('#confirmTitle').textContent=title;document.querySelector('#confirmDescription').textContent=description;
      pendingDelete=action;confirmButton.disabled=false;confirmButton.textContent='删除';openOverlay(confirmModal,document.querySelector('#cancelConfirm'));
    }
    document.querySelector('#closeConfirm').addEventListener('click',closeConfirmation);
    document.querySelector('#cancelConfirm').addEventListener('click',closeConfirmation);
    confirmModal.addEventListener('click',event=>{if(event.target===confirmModal)closeConfirmation();});
    confirmButton.addEventListener('click',async()=>{
      if(!pendingDelete)return;confirmButton.disabled=true;confirmButton.textContent='正在删除…';
      try{await pendingDelete();closeConfirmation(true);}
      catch(error){document.querySelector('#confirmDescription').textContent=error.message||'删除失败，请稍后重试。';confirmButton.disabled=false;confirmButton.textContent='重试';}
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&confirmModal.classList.contains('open'))closeConfirmation();});
    document.querySelector('#newConversation').addEventListener('click',newConversation);
    document.querySelector('#newConversationMobile').addEventListener('click',newConversation);
    refreshConversations();
    openConversation(currentSessionId);

    let knowledgeStatusPending = false;
    async function refreshKnowledgeStatus() {
      if (knowledgeStatusPending) return;
      knowledgeStatusPending = true;
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 8000);
      const badge = document.querySelector('#knowledgeStatus');
      const label = document.querySelector('#knowledgeStatusText');
      try {
        const response = await fetch('/api/knowledge-status', {cache:'no-store', signal:controller.signal});
        const data = await response.json();
        if (!data.connected) throw new Error(data.error || 'Milvus 不可用');
        const ready = data.collections.new || data.collections.old || data.collections.databases;
        badge.className = `status ${ready ? 'connected' : 'disconnected'}`;
        label.textContent = ready ? '资料库已连接' : '已连接，尚无资料索引';
        badge.title = `增量索引：${data.collections.new ? '已就绪' : '未建立'}；目录索引：${data.collections.databases ? '已就绪' : '未建立'}；基础索引：${data.collections.old ? '已就绪' : '未建立'}。地址：${data.uri}`;
      } catch (error) {
        badge.className = 'status disconnected';
        label.textContent = '资料库未连接';
        badge.title = `无法连接本地 Milvus：${error.message || '请求失败'}`;
      } finally {
        window.clearTimeout(timeout);
        knowledgeStatusPending = false;
      }
    }
    refreshKnowledgeStatus();
    setInterval(refreshKnowledgeStatus, 10000);

    function appendInlineMarkdown(parent, source) {
      const pattern = /\[([^\]]+)\]\(([^\s)]+)\)|`([^`]+)`|\*\*(.+?)\*\*|__(.+?)__|\*(?!\s)(.+?)\*|_(?!\s)(.+?)_/g;
      let cursor = 0;
      for (const match of source.matchAll(pattern)) {
        parent.append(document.createTextNode(source.slice(cursor, match.index)));
        if (match[3] !== undefined) {
          const code = document.createElement('code'); code.textContent = match[3]; parent.append(code);
        } else if (match[1] !== undefined) {
          let url;
          try { url = new URL(match[2], window.location.href); } catch {}
          if (url && ['http:', 'https:', 'mailto:'].includes(url.protocol)) {
            const link = document.createElement('a'); link.href = url.href; link.textContent = match[1];
            if (url.protocol !== 'mailto:') { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
            parent.append(link);
          } else parent.append(document.createTextNode(match[0]));
        } else {
          const strong = match[4] ?? match[5];
          const node = document.createElement(strong !== undefined ? 'strong' : 'em');
          node.textContent = strong ?? match[6] ?? match[7]; parent.append(node);
        }
        cursor = match.index + match[0].length;
      }
      parent.append(document.createTextNode(source.slice(cursor)));
    }
    function renderMarkdown(container, markdown) {
      container.replaceChildren();
      const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
      const isTableRule = line => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      const cells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) { index++; continue; }
        if (/^\s{0,3}(?:#{1,6}\s*)?可继续追问[:：]?\s*$/.test(line)) {
          index++; const items = [];
          while (index < lines.length && lines[index].trim()) {
            const item = lines[index].match(/^\s*(?:[-+*]|\d+[.)])\s+(.+)$/);
            if (!item) break;
            items.push(item[1]); index++;
          }
          if (items.length) addSuggestions(items, container);
          continue;
        }
        if (/^\s*```/.test(line)) {
          index++; const codeLines = [];
          while (index < lines.length && !/^\s*```/.test(lines[index])) codeLines.push(lines[index++]);
          if (index < lines.length) index++;
          const pre = document.createElement('pre'); const code = document.createElement('code');
          code.textContent = codeLines.join('\n'); pre.append(code); container.append(pre); continue;
        }
        const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          const node = document.createElement(`h${heading[1].length}`); appendInlineMarkdown(node, heading[2]); container.append(node); index++; continue;
        }
        if (/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)) { container.append(document.createElement('hr')); index++; continue; }
        if (index + 1 < lines.length && line.includes('|') && isTableRule(lines[index + 1])) {
          const headers = cells(line); index += 2;
          const table = document.createElement('table'); const thead = document.createElement('thead'); const headRow = document.createElement('tr');
          for (const value of headers) { const th = document.createElement('th'); appendInlineMarkdown(th, value); headRow.append(th); }
          thead.append(headRow); table.append(thead); const tbody = document.createElement('tbody');
          while (index < lines.length && lines[index].includes('|') && lines[index].trim()) {
            const row = document.createElement('tr');
            for (const value of cells(lines[index++])) { const td = document.createElement('td'); appendInlineMarkdown(td, value); row.append(td); }
            tbody.append(row);
          }
          table.append(tbody); container.append(table); continue;
        }
        if (/^\s*>/.test(line)) {
          const quote = document.createElement('blockquote'); const content = [];
          while (index < lines.length && /^\s*>/.test(lines[index])) content.push(lines[index++].replace(/^\s*>\s?/, ''));
          const p = document.createElement('p'); appendInlineMarkdown(p, content.join(' ')); quote.append(p); container.append(quote); continue;
        }
        const list = line.match(/^\s*(?:([-+*])|((?:\d+)[.)]))\s+(.+)$/);
        if (list) {
          const ordered = Boolean(list[2]); const node = document.createElement(ordered ? 'ol' : 'ul');
          while (index < lines.length) {
            const item = lines[index].match(/^\s*(?:([-+*])|((?:\d+)[.)]))\s+(.+)$/);
            if (!item || Boolean(item[2]) !== ordered) break;
            const li = document.createElement('li'); appendInlineMarkdown(li, item[3]); node.append(li); index++;
          }
          container.append(node); continue;
        }
        const paragraph = [];
        while (index < lines.length && lines[index].trim() && !/^\s{0,3}(?:#{1,6}\s|```|>|([-+*])\s|\d+[.)]\s)/.test(lines[index])) paragraph.push(lines[index++].trim());
        if (paragraph.length) { const p = document.createElement('p'); appendInlineMarkdown(p, paragraph.join(' ')); container.append(p); }
        else { const p = document.createElement('p'); appendInlineMarkdown(p, lines[index++]); container.append(p); }
      }
    }
    function addMessage(role, text = '') {
      if (empty) { messages.innerHTML = ''; empty = false; chatWorkspace.classList.remove('is-empty');followOutput=true; }
      const node = document.createElement('div');
      node.className = `message ${role}`;
      if (role !== 'user') {
        const label = document.createElement('span'); label.className = 'message-label'; label.textContent = role === 'error' ? '请求未完成' : '知研'; node.append(label);
      }
      const body = document.createElement('div');
      if (role === 'assistant') renderMarkdown(body, text); else body.textContent = text;
      node.append(body);
      messages.append(node); scrollMessages(role==='user');
      return {node, body};
    }
    function addSources(data) {
      const groups = [['资料库', data.library_sources], ['网络', data.web_sources]];
      const available = groups.filter(([,items]) => items?.length);
      if (!available.length) return;
      const details = document.createElement('details'); details.className = 'sources';
      const summary = document.createElement('summary'); summary.textContent = `查看来源 · ${available.reduce((n,g)=>n+g[1].length,0)} 条`; details.append(summary);
      for (const [title, items] of available) {
        const heading = document.createElement('div'); heading.className = 'source-row'; heading.style.fontWeight = '650'; heading.textContent = title; details.append(heading);
        for (const item of items) { const row = document.createElement('div'); row.className = 'source-row'; row.textContent = item; details.append(row); }
      }
      messages.append(details); scrollMessages();
    }
    function addSuggestions(items, parent = messages) {
      if (!items?.length) return;
      const row = document.createElement('div'); row.className = 'suggestions';
      for (const text of items) { const button = document.createElement('button'); button.className = 'suggestion'; button.textContent = text; button.onclick = () => { input.value = text;resizeInput();form.requestSubmit(); }; row.append(button); }
      parent.append(row); scrollMessages();
    }
    async function ask(question, options = {}) {
      if (!options.output) addMessage('user', question);
      const output = options.output || addMessage('assistant');
      output.body.textContent = '';
      let streamedAnswer = '';
      const cursor = document.createElement('i'); cursor.className = 'typing'; output.body.append(cursor);
      setChatBusy(true);sendButton.disabled = true;sendButton.setAttribute('aria-busy','true');output.node.setAttribute('aria-busy','true');
      try {
        const response = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, session_id:currentSessionId, allow_web_search:!!options.allowWebSearch, decline_web_search:!!options.declineWebSearch})});
        if (!response.ok || !response.body) throw new Error((await response.text()) || `HTTP ${response.status}`);
        const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
        while (true) {
          const {value, done} = await reader.read(); if (done) break;
          buffer += decoder.decode(value, {stream:true});
          const blocks = buffer.split('\n\n'); buffer = blocks.pop();
          for (const block of blocks) {
            const line = block.split('\n').find(x => x.startsWith('data: ')); if (!line) continue;
            const event = JSON.parse(line.slice(6));
            if (event.kind === 'token') { streamedAnswer += event.text; cursor.remove(); output.body.append(document.createTextNode(event.text)); output.body.append(cursor); scrollMessages(); }
            else if (event.kind === 'replace') { streamedAnswer = event.text; cursor.remove(); output.body.textContent=event.text; scrollMessages(); }
            else if (event.kind === 'web_search_consent') {
              cursor.remove(); output.body.textContent=event.text;
              const actions=document.createElement('div'); actions.className='consent-actions';
              const allow=document.createElement('button'); allow.type='button'; allow.className='consent-allow'; allow.textContent='允许本轮联网';
              const decline=document.createElement('button'); decline.type='button'; decline.className='consent-decline'; decline.textContent='暂不联网';
              allow.onclick=()=>{actions.remove();ask(question,{output,allowWebSearch:true});};
              decline.onclick=()=>{actions.remove();ask(question,{output,declineWebSearch:true});};
              actions.append(allow,decline); output.node.append(actions); scrollMessages();
            }
            else if (event.kind === 'sources') addSources(event);
            else if (event.kind === 'suggestions') { cursor.remove(); addSuggestions(event.suggestions); }
            else if (event.kind === 'error') throw new Error(event.message);
          }
        }
        cursor.remove();
        if (streamedAnswer) renderMarkdown(output.body, streamedAnswer);
        await refreshConversations();
      } catch (error) { cursor.remove(); output.node.classList.add('error');const message=document.createElement('p');message.textContent=error.message||'连接失败，请确认本地服务正在运行。';output.node.append(message);if(!input.value)input.value=question; }
      finally { setChatBusy(false);sendButton.removeAttribute('aria-busy');output.node.removeAttribute('aria-busy');resizeInput();if(document.body.dataset.mode==='chat'&&!document.querySelector('.modal-backdrop.open')&&!document.body.classList.contains('sidebar-open'))input.focus(); }
    }
    form.addEventListener('submit', event => { event.preventDefault(); const value = input.value.trim(); if (!value || sendButton.disabled) return; input.value='';resizeInput();ask(value); });
    input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && !composing && event.keyCode!==229) { event.preventDefault(); form.requestSubmit(); } });
    document.querySelectorAll('.chip').forEach(button => button.addEventListener('click', () => { input.value = button.dataset.prompt;resizeInput();form.requestSubmit(); }));

    const fileInput = document.querySelector('#fileInput');const folderInput=document.querySelector('#folderInput'); const notice = document.querySelector('#uploadNotice');
    let selectedUploads=[];
    function setSelectedUploads(files,append=false){
      const merged=append?[...selectedUploads,...files]:[...files];const unique=new Map();
      for(const file of merged){const relativePath=file.webkitRelativePath||file.name;unique.set(`${relativePath}\0${file.size}\0${file.lastModified}`,file);}
      selectedUploads=[...unique.values()];
      document.querySelector('#selectedFiles').textContent=selectedUploads.length?selectedUploads.map(file=>`${file.webkitRelativePath||file.name} · ${(file.size/1024/1024).toFixed(2)} MB`).join('；'):'支持选择多个 TXT、Markdown、PDF 文件，或选择包含这些文件的文件夹；单次上传总量不超过 100 MB。';
    }
    const drop=document.querySelector('#fileDrop');
    async function refreshDatabases() {
      const controller=new AbortController();const timeout=window.setTimeout(()=>controller.abort(),20000);
      let data;
      try {
        const response=await fetch('/api/databases/details',{cache:'no-store',signal:controller.signal});
        data=await response.json();
        if(!response.ok)throw new Error(data.error||'无法读取资料库列表');
      } finally {window.clearTimeout(timeout);}
      document.querySelector('#databaseList').innerHTML='';
      const folders=data.databases;
      document.querySelector('#databaseCount').textContent='';
      const root=document.createElement('details');root.className='database-item database-root';root.open=true;
      const rootSummary=document.createElement('summary');const rootIcon=document.createElement('span');rootIcon.className='db-icon';rootIcon.textContent='▤';
      const rootHeading=document.createElement('span');rootHeading.className='db-heading';const rootName=document.createElement('span');rootName.className='db-name';rootName.textContent='数据库';rootHeading.append(rootName);
      const rootCaret=document.createElement('span');rootCaret.className='db-caret';rootCaret.textContent='›';rootSummary.append(rootIcon,rootHeading,rootCaret);root.append(rootSummary);
      const rootDetails=document.createElement('div');rootDetails.className='db-details';
      for(const db of folders){
        const folderRow=document.createElement('div');folderRow.className='folder-row';
        const folder=document.createElement('div');folder.className='database-item';
        const summary=document.createElement('div');summary.className='database-heading';const icon=document.createElement('span');icon.className='db-icon';icon.innerHTML='<svg class="icon"><use href="#i-db"/></svg>';
        const heading=document.createElement('span');heading.className='db-heading';const name=document.createElement('span');name.className='db-name';name.textContent=db.id==='initial'?'上海地方志':db.name;
        heading.append(name);summary.append(icon,heading);folder.append(summary);
        if(db.id!=='legacy-additions'){
          const remove=document.createElement('button');remove.type='button';remove.className='row-delete folder-delete';remove.innerHTML='<svg class="icon"><use href="#i-trash"/></svg>';remove.title='删除此目录';remove.setAttribute('aria-label','删除此目录');
          const warning=db.id==='initial'?'删除后将移除上海地方志原始文件、原始索引，以及该目录下导入的补充文件和索引。此操作无法恢复。':`确定删除目录“${db.name}”及其中所有原始资料、补充资料和索引吗？删除后无法恢复。`;
          remove.onclick=()=>confirmDeletion('删除资料目录',warning,async()=>{
            const response=await fetch(`/api/databases/${encodeURIComponent(db.id)}`,{method:'DELETE'});await readDeleteResponse(response,'删除目录失败。');
            await refreshDatabases();await refreshKnowledgeStatus();
          });
          folderRow.append(folder,remove);
        }else folderRow.append(folder);
        rootDetails.append(folderRow);
      }
      root.append(rootDetails);document.querySelector('#databaseList').append(root);
    }
    async function upload(files, targetDatabaseId) {
      if (!files.length) throw new Error('请先选择要导入的文件。');
      const formData=new FormData(); for(const file of files) formData.append('files',file,file.webkitRelativePath||file.name);
      const response=await fetch(`/api/upload?database_id=${encodeURIComponent(targetDatabaseId)}`,{method:'POST',body:formData});
      const data=await response.json();if(!response.ok)throw new Error(data.error||'文件上传失败。');return data.files;
    }
    async function updateIndexedFile(databaseId, oldHash, file) {
      if(!file)return;
      try{const files=await upload([file],databaseId);if(!files?.length)return;notice.textContent='新文件已暂存，正在更新资料索引…';
          const response=await fetch('/api/index',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:files[0],database_id:databaseId,replace_hash:oldHash,data_version:'supplement'})});const result=await response.json();if(!response.ok)throw new Error(result.error);notice.textContent=`单文件更新完成：${result.message}`;await refreshDatabases();await refreshKnowledgeStatus();}
      catch(error){notice.textContent=`单文件更新未完成：${error.message||'请查看索引状态后重试。'}`;await refreshDatabases();}
    }
    const importModal=document.querySelector('#importModal');const importButton=document.querySelector('#createDatabase');
    function closeImport(){if(importButton.disabled)return;closeOverlay(importModal);}
    function openImport(){
      openOverlay(importModal,document.querySelector('#newDatabaseName'));notice.textContent='';fileInput.value='';folderInput.value='';setSelectedUploads([]);
      document.querySelector('#newDatabaseName').focus();
    }
    document.querySelector('#openImport').addEventListener('click',openImport);
    document.querySelector('#closeImport').addEventListener('click',closeImport);
    document.querySelector('#cancelImport').addEventListener('click',closeImport);
    importModal.addEventListener('click',event=>{if(event.target===importModal)closeImport();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&importModal.classList.contains('open'))closeImport();});
    fileInput.addEventListener('change',()=>setSelectedUploads([...fileInput.files],true));
    folderInput.addEventListener('change',()=>setSelectedUploads([...folderInput.files],true));
    importButton.addEventListener('click',async()=>{
      const files=selectedUploads;if(!files.length){notice.textContent='请选择文件或文件夹。';return;}
      importButton.disabled=true;importButton.textContent='正在处理…';
      try{
        const name=document.querySelector('#newDatabaseName').value.trim();if(!name)throw new Error('请填写新目录名称。');
        notice.textContent='正在创建目录，导入期间请等待当前操作完成…';
        const response=await fetch('/api/databases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const data=await response.json();if(!response.ok)throw new Error(data.error||'创建目录失败。');const databaseId=data.database.id;
        if(!databaseId)throw new Error('创建目录未返回有效标识，请刷新资料库列表后重试。');
        notice.textContent='正在上传文件…';const paths=await upload(files,databaseId);
        for(let index=0;index<paths.length;index++){
          notice.textContent=`正在解析并向量化：${paths[index]}（${index+1}/${paths.length}）`;
          const dataVersion='original';
          const response=await fetch('/api/index',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:paths[index],database_id:databaseId,data_version:dataVersion})});const result=await response.json();if(!response.ok)throw new Error(result.error||`${paths[index]} 索引失败。`);
        }
        notice.textContent=`导入完成：${paths.length} 个文件已加入资料库。`;
        await refreshDatabases();await refreshKnowledgeStatus();
        fileInput.value='';folderInput.value='';selectedUploads=[];document.querySelector('#selectedFiles').textContent='导入完成。';
        window.setTimeout(closeImport,1100);
      }catch(error){notice.textContent=`导入未完成：${error.message||'请检查文件和 Milvus 状态后重试。'}`;await refreshDatabases().catch(()=>{});}
      finally{importButton.disabled=false;importButton.textContent='新建目录并导入';}
    });
    drop.addEventListener('dragover',event=>{event.preventDefault();drop.style.background='var(--bg-hover)'});
    drop.addEventListener('dragleave',()=>drop.style.background='');
    drop.addEventListener('drop',event=>{event.preventDefault();drop.style.background='';setSelectedUploads([...event.dataTransfer.files],true);});
    refreshDatabases().catch(()=>{document.querySelector('#databaseList').innerHTML='<div class="history-empty">无法读取资料库列表</div>';});
  </script>
